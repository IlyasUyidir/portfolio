# ── Application ─────────────────────────────────
spring.application.name=portfolio

# ── Datasource (overridden by docker-compose env vars) ──
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:portfolio_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ──────────────────────────────────────
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT ─────────────────────────────────────────
jwt.secret=${JWT_SECRET:your-super-secret-key-min-256-bits-long-asdfghjklqwertyuiopzxcvbnm}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Server ──────────────────────────────────────
server.port=8080
