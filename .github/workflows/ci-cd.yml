name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------
  # NEW (Milestone 6, Phase 1): full-history secret scan.
  # Runs independently of the test jobs — no JDK/Node/Postgres needed,
  # so it doesn't wait on or block those jobs.
  # ---------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, not just the diff — Gitleaks needs this
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: portfolio_user
          POSTGRES_PASSWORD: test_password_ci_only
          POSTGRES_DB: portfolio_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run backend tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/portfolio_db
          SPRING_DATASOURCE_PASSWORD: test_password_ci_only
          JWT_SECRET: ci_test_secret_do_not_use_in_prod_1234567890
          APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: ./mvnw test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Run tests
        working-directory: frontend
        run: npm run test -- --run

  build-and-push:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      repo_lower: ${{ steps.repo-name.outputs.lower }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Repo Name to Lowercase
        id: repo-name
        run: echo "lower=${GITHUB_REPOSITORY@L}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo-name.outputs.lower }}/folio-backend:${{ github.sha }}
            ghcr.io/${{ steps.repo-name.outputs.lower }}/folio-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_BASE_URL=https://folio-ilyas.duckdns.org/api/v1
          tags: |
            ghcr.io/${{ steps.repo-name.outputs.lower }}/folio-frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo-name.outputs.lower }}/folio-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------------
      # NEW (Milestone 6, Phase 2): fail the pipeline before deploy
      # can happen if either image has a HIGH/CRITICAL vulnerability.
      # Images are already in GHCR by this point (push: true above) —
      # this gate blocks deploy-production, not the registry push itself.
      # See guide note on push:false + load:true if you want the
      # registry itself to never receive a failing image.
      # -------------------------------------------------------------
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ steps.repo-name.outputs.lower }}/folio-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ steps.repo-name.outputs.lower }}/folio-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VPS (production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/folio

            git pull origin main

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export GHCR_REPO="${{ needs.build-and-push.outputs.repo_lower }}"
            export SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export GRAFANA_ADMIN_PASSWORD="${{ secrets.GRAFANA_ADMIN_PASSWORD }}"
            export BACKEND_IMAGE_TAG=${{ github.sha }}
            export FRONTEND_IMAGE_TAG=${{ github.sha }}

            docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml pull backend frontend
            docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d --force-recreate --no-deps caddy
            docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d --force-recreate --no-deps grafana
            docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml ps
